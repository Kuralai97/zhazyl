name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Тәуелділіктер
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Линтер (ruff)
        run: ruff check .
      - name: Тесттер және қамту (кемінде 60 %)
        working-directory: src
        run: |
          coverage run --source=booking manage.py test booking
          coverage report --fail-under=60
      - name: Құпияларды іздеу (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 dir /repo -v
      - name: Тәуелділіктердің осалдығы (pip-audit, OSV дерекқоры)
        run: pip-audit -r requirements.txt
