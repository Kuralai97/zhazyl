name: DORA

on:
  workflow_dispatch:

jobs:
  dora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests pandas matplotlib
      - name: DORA метрикаларын есептеу
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/dora.py
      - uses: actions/upload-artifact@v5
        with:
          name: dora-dashboard
          path: dora-out/
